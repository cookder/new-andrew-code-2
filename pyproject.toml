[project]
name = "golf-analyzer"
version = "0.1.0"
description = "Ingest Full Swing simulator range videos, extract per-shot stats and spoken feedback, surface trends over time."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Phase 3 (vision), phase 5 (insight agent), phase 6 (voice attribution).
llm = ["anthropic>=0.69"]
# Phase 2 (audio) and phase 3/4 (frames and clips).
media = [
    "ffmpeg-python>=0.2",
    "faster-whisper>=1.0",
    "librosa>=0.10",
    "opencv-python>=4.9",
    "numpy>=1.26",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
golf-seed = "backend.app.seed:main"
golf-ingest = "backend.app.pipeline.watcher:main"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 96
target-version = "py311"
